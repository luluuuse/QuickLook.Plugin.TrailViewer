<!doctype html>
<!-- lang and the title are replaced at load time: the viewer follows the system language and can be switched. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Everything in the file is treated as text; scripts only from this folder. Photos are the one exception:
       a waypoint may point at any https image, so img-src is open to https and to nothing else. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://file.trailviewer.example; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Track viewer</title>
  <link rel="icon" type="image/svg+xml" href="assets/trailviewer-icon.svg">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/panels.css">
  <link rel="stylesheet" href="css/toolbox.css">
  <link rel="stylesheet" href="css/layers.css">
  <link rel="stylesheet" href="css/map-data.css">
  <link rel="stylesheet" href="css/photos.css">
  <link rel="modulepreload" href="app.js">
  <link rel="modulepreload" href="gpx.js">
  <link rel="modulepreload" href="kml.js">
  <link rel="modulepreload" href="fit.js">
  <link rel="modulepreload" href="route-model.js">
  <link rel="modulepreload" href="i18n.js">
  <link rel="modulepreload" href="map-controls.js">
  <link rel="modulepreload" href="map-view.js">
  <script src="vendor/leaflet/leaflet.js"></script>
</head>
<body>
  <div id="map"></div>
  <section id="info" aria-live="polite" hidden></section>
  <section id="splits" aria-live="polite" hidden></section>
  <section id="track-selector" aria-live="polite" hidden></section>
  <section id="profile" hidden></section>
  <div id="message" role="alert" hidden></div>
  <div id="toast" role="status" aria-live="polite" aria-atomic="true" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
