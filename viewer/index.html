<!doctype html>
<!-- lang and the title are replaced at load time: the viewer follows the system language and can be switched. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Everything in the file is treated as text; scripts only from this folder. Photos are the one exception:
       a waypoint may point at any https image, so img-src is open to https and to nothing else. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://file.gpxviewer.example; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Track viewer</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="style.css">
  <script src="vendor/leaflet/leaflet.js"></script>
</head>
<body>
  <div id="map"></div>
  <section id="info" hidden></section>
  <div id="keys" hidden></div>
  <section id="profile" hidden></section>
  <div id="message" hidden></div>
  <div id="toast" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
