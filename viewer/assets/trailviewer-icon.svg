      <stop offset="100%" stop-color="#1A2638" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="clipNW">
      <polygon points="6,6 142,6 135,22 138,44 129,72 132,96 128,122 98,126 72,122 44,132 22,129 6,138"/>
    </clipPath>
    <clipPath id="clipNE">
