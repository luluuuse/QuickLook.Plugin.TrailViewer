<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- 3A Sculpted Alpine Specimen Silhouette:
         NW smooth sunlit contours, NE angular glacier facets,
         SE serrated Swiss rock crags, SW rolling alpine meadow with blue-stream valley notch -->
    <clipPath id="alpineSpecimenClip">
      <path d="M 139 8 L 158 24 L 182 22 L 204 38 L 226 46 L 232 72 L 244 96 L 238 118 L 250 137 L 234 152 L 244 172 L 226 188 L 232 208 L 208 218 L 194 236 L 170 232 L 152 246 L 130 238 L 113 249 C 96 242, 82 246, 68 242 C 62 232, 56 230, 50 234 C 34 226, 20 212, 16 194 C 11 180, 18 168, 13 154 C 10 144, 6 139, 8 136 C 16 122, 16 106, 24 90 C 32 72, 42 58, 56 44 C 72 30, 92 20, 114 14 C 124 11, 132 10, 139 8 Z"/>
    </clipPath>

    <radialGradient id="nwRef" cx="128" cy="122" r="155" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="32%" stop-color="#FCF8EA"/>
      <stop offset="72%" stop-color="#F3EBD6"/>
      <stop offset="100%" stop-color="#E7DEC5"/>
    </radialGradient>
    <radialGradient id="neRef" cx="128" cy="122" r="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#F0F8FE"/>
      <stop offset="75%" stop-color="#D7ECFA"/>
      <stop offset="100%" stop-color="#BEDDF4"/>
    </radialGradient>
    <radialGradient id="seRef" cx="128" cy="122" r="165" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3A506E"/>
      <stop offset="36%" stop-color="#567093"/>
      <stop offset="74%" stop-color="#748FB2"/>
      <stop offset="100%" stop-color="#5A7496"/>
    </radialGradient>
    <radialGradient id="swRef" cx="128" cy="122" r="165" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F4F5DF"/>
      <stop offset="28%" stop-color="#D7ECAE"/>
      <stop offset="65%" stop-color="#AEDA7C"/>
      <stop offset="100%" stop-color="#82BA57"/>
    </radialGradient>
    <radialGradient id="peakLift" cx="116" cy="110" r="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.24"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="seDepthGrad" x1="0.2" y1="0.2" x2="0.95" y2="0.95">
