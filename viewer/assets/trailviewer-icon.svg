    </clipPath>
    <clipPath id="clipSE">
      <polygon points="128,122 156,127 182,123 208,133 232,130 250,138 250,250 112,250 120,232 116,208 126,178 123,152"/>
    </clipPath>
    <clipPath id="clipSW">
      <polygon points="6,138 22,129 44,132 72,122 98,126 128,122 123,152 126,178 116,208 120,232 112,250 6,250"/>
    </clipPath>

    <g id="contoursIndex">
      <path d="M 134 48 C 176 52, 204 82, 208 130 C 202 174, 168 202, 118 206 C 74 202, 46 174, 44 130 C 48 82, 84 52, 134 48 Z"/>
      <path d="M 138 10 C 202 16, 242 64, 250 135 C 242 202, 194 242, 114 248 C 48 242, 8 202, 2 137 C 10 64, 62 16, 138 10 Z"/>
    </g>
    <g id="contoursInter">
      <path d="M 131 84 C 153 86, 166 102, 168 125 C 164 147, 147 162, 123 164 C 101 162, 86 147, 84 125 C 86 102, 103 86, 131 84 Z"/>
      <path d="M 132 66 C 165 69, 185 92, 188 127 C 183 161, 158 182, 121 185 C 87 182, 66 161, 64 127 C 67 92, 94 69, 132 66 Z"/>
      <path d="M 136 29 C 189 34, 223 73, 229 132 C 222 188, 181 222, 116 227 C 61 222, 27 188, 23 133 C 29 73, 73 34, 136 29 Z"/>
      <path d="M 141 -12 C 214 -4, 260 50, 270 137 C 260 214, 204 260, 112 268 C 38 260, -10 214, -18 140 C -8 50, 54 -4, 141 -12 Z"/>
      <path d="M 144 -34 C 230 -24, 286 38, 298 140 C 288 232, 220 288, 108 296 C 20 288, -36 232, -46 144 C -34 38, 42 -24, 144 -34 Z"/>
    </g>
