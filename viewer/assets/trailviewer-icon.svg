<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- G10: Minimal Alpine Emblem (D9 × Studio Ghibli palette) -->
    <clipPath id="alpineClip">
      <path d="M 134 16 L 194 36 L 236 86 L 242 132 L 222 194 L 174 232 L 120 240 A 112 112 0 0 1 134 16 Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#alpineClip)">
    <!-- Four flat terrain quadrants -->
    <polygon points="0,0 135,0 128,128 0,128" fill="#FFF6DC"/>
    <polygon points="135,0 256,0 256,132 128,128" fill="#82CDF2"/>
    <polygon points="0,128 128,128 119,256 0,256" fill="#7AC663"/>
    <polygon points="128,128 256,132 256,256 119,256" fill="#294869"/>

    <!-- Minimal horizontal sky clouds & sunlit meadow accent -->
    <path d="M 170 72 L 212 72" stroke="#FFFDF5" stroke-width="6.5" stroke-linecap="round" opacity="0.92"/>
    <path d="M 190 90 L 222 90" stroke="#FFFDF5" stroke-width="5" stroke-linecap="round" opacity="0.78"/>
    <path d="M 42 184 L 78 184" stroke="#E8F6B8" stroke-width="5" stroke-linecap="round" opacity="0.65"/>

    <!-- Minimal cross ridges -->
    <g fill="none" stroke="#1E3250" stroke-width="5.8" stroke-linecap="round">
      <path d="M 134 16 L 128 128 L 120 240"/>
      <path d="M 16 128 L 128 128 L 242 132"/>
    </g>

    <!-- Center Swiss survey triangulation peak symbol -->
    <polygon points="128,76 172,152 84,152" fill="#FFFDF6" stroke="#FFFDF6" stroke-width="8" stroke-linejoin="round"/>
    <polygon points="128,82 166,147 90,147" fill="#FFFDF6" stroke="#1E3250" stroke-width="5.8" stroke-linejoin="round"/>
    <circle cx="128" cy="128" r="11.5" fill="#E34234"/>
  </g>

  <!-- Crisp outer alpine silhouette -->
  <path d="M 134 16 L 194 36 L 236 86 L 242 132 L 222 194 L 174 232 L 120 240 A 112 112 0 0 1 134 16 Z"
        fill="none" stroke="#1E3250" stroke-width="5.8" stroke-linejoin="round"/>
</svg>
