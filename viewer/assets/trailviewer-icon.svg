    <g clip-path="url(#clipSE)">
      <polygon points="128,122 184,158 170,174 128,136" fill="#A2BCD8" opacity="0.46"/>
      <polygon points="128,122 152,202 138,208 124,150" fill="#95B0CE" opacity="0.38"/>
      <polygon points="164,132 232,160 220,170 162,140" fill="#9EB8D5" opacity="0.34"/>
      <g fill="#19212B" stroke="#151C24" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 134 128 L 166 154 L 184 184 L 218 212 L 246 246 L 222 250 L 194 214 L 166 186 L 146 158 Z" opacity="0.88"/>
        <path d="M 146 126 L 196 136 L 224 156 L 250 170 L 250 192 L 214 166 L 182 148 L 148 138 Z" opacity="0.86"/>
        <path d="M 125 144 L 142 184 L 162 218 L 178 250 L 152 250 L 138 214 L 122 178 Z" opacity="0.84"/>
        <g fill="none" stroke="#18202A" stroke-linecap="round">
          <path d="M 156 142 L 194 159" stroke-width="2.6"/>
          <path d="M 168 152 L 208 172" stroke-width="1.8" opacity="0.85"/>
          <path d="M 176 164 L 226 190" stroke-width="2.6"/>
          <path d="M 186 176 L 236 204" stroke-width="1.8" opacity="0.85"/>
          <path d="M 196 190 L 246 218" stroke-width="2.8"/>
          <path d="M 208 206 L 248 230" stroke-width="1.8" opacity="0.82"/>
          <path d="M 142 162 L 176 200" stroke-width="2.6"/>
          <path d="M 150 182 L 188 220" stroke-width="1.8" opacity="0.85"/>
          <path d="M 158 202 L 198 242" stroke-width="2.4"/>
          <path d="M 132 192 L 156 234" stroke-width="2.6"/>
          <path d="M 126 212 L 144 246" stroke-width="1.8" opacity="0.82"/>
          <path d="M 192 128 L 244 148" stroke-width="2.4"/>
          <path d="M 212 142 L 248 158" stroke-width="1.8" opacity="0.82"/>
        </g>
      </g>
    </g>

    <!-- Organic Serrated Four Main Alpine Arêtes -->
    <g fill="none" stroke="#18202A" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 128 122 L 132 96 L 129 72 L 138 44 L 135 22 L 142 6" stroke-width="4.2"/>
      <path d="M 128 122 L 156 127 L 182 123 L 208 133 L 232 130 L 250 138" stroke-width="4.2"/>
      <path d="M 128 122 L 123 152 L 126 178 L 116 208 L 120 232 L 112 250" stroke-width="4.2"/>
      <path d="M 128 122 L 98 126 L 72 122 L 44 132 L 22 129 L 6 138" stroke-width="2.8" opacity="0.68"/>
    </g>

    <!-- Sculpted Rock Spurs along North & South Arêtes -->
    <g fill="#1C2531" opacity="0.85">
      <path d="M 131 94 L 156 88 L 148 100 L 130 105 Z"/>
      <path d="M 133 66 L 160 58 L 151 70 L 130 76 Z"/>
      <path d="M 137 36 L 160 28 L 153 39 L 136 46 Z"/>
      <path d="M 135 16 L 152 10 L 148 19 L 135 24 Z" opacity="0.75"/>
    </g>
    <g stroke="#222E3D" stroke-width="2" stroke-linecap="round" opacity="0.58">
      <path d="M 130 82 L 114 75"/><path d="M 134 54 L 118 48"/>
      <path d="M 124 156 L 105 164"/><path d="M 124 184 L 103 194"/><path d="M 119 212 L 102 222"/>
    </g>

    <!-- Central Summit Elevation Glow -->
    <rect x="0" y="0" width="256" height="256" fill="url(#peakLift)"/>

    <!-- Organic Mountain Switchback Footpath (SW Meadow -> NW Contours -> NE Glacier -> Straight to Summit) -->
    <path d="M 34 226 C 46 218, 40 206, 54 198 C 68 190, 58 176, 46 168 C 34 160, 46 146, 62 138 C 74 132, 54 118, 48 104 C 43 92, 64 88, 72 76 C 80 64, 76 50, 94 46 C 112 42, 118 58, 134 52 C 150 46, 166 50, 178 64 C 188 76, 172 86, 180 96 C 186 104, 174 108, 166 110 L 128 122"
          fill="none" stroke="#222A34" stroke-width="2.1" stroke-dasharray="4.5 3.6"
          stroke-linecap="round" stroke-linejoin="round" opacity="0.72"/>

    <!-- T4 Swiss Survey Triangulation Peak Symbol (White Fill + Bold Ink Frame + Red Dot) -->
    <polygon points="128,94 153,138 103,138" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="5.5" stroke-linejoin="round"/>
    <polygon points="128,100 148,134 108,134" fill="#FFFFFF" stroke="#18202A" stroke-width="4.2" stroke-linejoin="round"/>
    <circle cx="128" cy="123" r="5.6" fill="#DC2626"/>
  </g>

  <!-- Subtle Alpine Relief Contour Edge -->
  <path d="M 139 8 L 158 24 L 182 22 L 204 38 L 226 46 L 232 72 L 244 96 L 238 118 L 250 137 L 234 152 L 244 172 L 226 188 L 232 208 L 208 218 L 194 236 L 170 232 L 152 246 L 130 238 L 113 249 C 96 242, 82 246, 68 242 C 62 232, 56 230, 50 234 C 34 226, 20 212, 16 194 C 11 180, 18 168, 13 154 C 10 144, 6 139, 8 136 C 16 122, 16 106, 24 90 C 32 72, 42 58, 56 44 C 72 30, 92 20, 114 14 C 124 11, 132 10, 139 8 Z"
        fill="none" stroke="#18202A" stroke-opacity="0.24" stroke-width="2" stroke-linejoin="round"/>
</svg>
