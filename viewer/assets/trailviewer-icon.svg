  <g clip-path="url(#alpineSpecimenClip)">
    <!-- Four Organic Ridge-Bounded Terrain Quadrants -->
    <g clip-path="url(#clipNW)"><rect x="0" y="0" width="256" height="256" fill="url(#nwRef)"/></g>
    <g clip-path="url(#clipNE)"><rect x="0" y="0" width="256" height="256" fill="url(#neRef)"/></g>
    <g clip-path="url(#clipSE)">
      <rect x="0" y="0" width="256" height="256" fill="url(#seRef)"/>
      <rect x="0" y="0" width="256" height="256" fill="url(#seDepthGrad)"/>
    </g>
    <g clip-path="url(#clipSW)"><rect x="0" y="0" width="256" height="256" fill="url(#swRef)"/></g>

    <!-- Seamless Continuous Dual-Weight Swiss Contours -->
    <g clip-path="url(#clipNW)" fill="none" stroke="#B08154">
      <g stroke-width="2.5" opacity="0.78"><use href="#contoursIndex"/></g>
      <g stroke-width="1.35" opacity="0.58"><use href="#contoursInter"/></g>
    </g>
    <g clip-path="url(#clipNE)" fill="none" stroke="#3A91D4">
      <g stroke-width="2.5" opacity="0.82"><use href="#contoursIndex"/></g>
      <g stroke-width="1.35" opacity="0.62"><use href="#contoursInter"/></g>
    </g>
    <g clip-path="url(#clipSW)" fill="none" stroke="#6B8746">
      <g stroke-width="2.2" opacity="0.62"><use href="#contoursIndex"/></g>
      <g stroke-width="1.25" opacity="0.46"><use href="#contoursInter"/></g>
    </g>
    <g clip-path="url(#clipSE)" fill="none" stroke="#D0E3F6">
      <g stroke-width="1.5" opacity="0.28"><use href="#contoursIndex"/></g>
      <g stroke-width="1" opacity="0.18"><use href="#contoursInter"/></g>
    </g>

    <!-- NW Scree Stipple -->
    <g clip-path="url(#clipNW)" fill="#525C68" opacity="0.48">
      <circle cx="96" cy="96" r="1.4"/><circle cx="104" cy="90" r="1.1"/><circle cx="88" cy="104" r="1.3"/>
      <circle cx="110" cy="78" r="1.2"/><circle cx="102" cy="108" r="1.2"/><circle cx="78" cy="112" r="1.4"/>
      <circle cx="116" cy="64" r="1.1"/><circle cx="108" cy="54" r="1.3"/><circle cx="120" cy="40" r="1.2"/>
      <circle cx="92" cy="84" r="1.1"/><circle cx="64" cy="116" r="1.2"/><circle cx="114" cy="102" r="1.3"/>
    </g>

    <!-- NE Glacial Tarn, Meltwater Outlet & Crevasses -->
    <g clip-path="url(#clipNE)">
      <path d="M 192 50 C 202 42, 218 44, 222 54 C 225 63, 212 69, 198 66 C 188 64, 185 56, 192 50 Z"
            fill="#80C8F5" stroke="#2B7EC0" stroke-width="2.1"/>
      <path d="M 218 46 C 228 36, 238 28, 248 22" fill="none" stroke="#3F96D8" stroke-width="2" stroke-linecap="round"/>
      <g stroke="#2F85C7" stroke-width="1.4" stroke-linecap="round" opacity="0.62">
        <path d="M 164 96 L 176 90"/><path d="M 170 104 L 184 97"/><path d="M 178 110 L 190 104"/>
        <path d="M 156 54 L 168 48"/><path d="M 160 62 L 173 56"/>
      </g>
    </g>

    <!-- SW Alpine Forest Stipple & Glacial Stream -->
    <g clip-path="url(#clipSW)">
      <path d="M 6 156 C 42 162, 74 188, 102 250 L 6 250 Z" fill="#7AB352" opacity="0.28"/>
      <g fill="#45782C" opacity="0.58">
        <circle cx="22" cy="158" r="2.1"/><circle cx="34" cy="164" r="1.8"/><circle cx="18" cy="172" r="2"/>
        <circle cx="46" cy="172" r="2.1"/><circle cx="30" cy="178" r="1.7"/><circle cx="56" cy="182" r="2"/>
        <circle cx="42" cy="188" r="1.8"/><circle cx="18" cy="212" r="2.1"/><circle cx="32" cy="218" r="1.9"/>
        <circle cx="26" cy="230" r="2.2"/><circle cx="44" cy="232" r="1.8"/><circle cx="38" cy="242" r="2"/>
        <circle cx="84" cy="204" r="2"/><circle cx="96" cy="212" r="1.8"/><circle cx="78" cy="218" r="2.1"/>
        <circle cx="90" cy="226" r="1.9"/><circle cx="104" cy="228" r="2"/><circle cx="84" cy="238" r="2.1"/>
        <circle cx="98" cy="242" r="1.8"/>
      </g>
      <path d="M 6 196 C 36 198, 54 218, 66 254" fill="none" stroke="#3B94D8" stroke-width="6.8" stroke-linecap="round"/>
      <path d="M 6 196 C 36 198, 54 218, 66 254" fill="none" stroke="#BEE5FB" stroke-width="1.8" stroke-linecap="round" opacity="0.65"/>
      <path d="M 88 158 C 72 174, 58 192, 48 210" fill="none" stroke="#3B94D8" stroke-width="2.4" stroke-linecap="round" opacity="0.85"/>
    </g>

