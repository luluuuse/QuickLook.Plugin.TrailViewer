name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install browser test dependencies
        run: npm ci

      - name: Static checks
        run: npm run check

      - name: Fixtures match tools/make-fixtures.py
        shell: pwsh
        run: |
          python -B tools/make-fixtures.py
          git status --porcelain tests/fixtures
          git diff --exit-code --stat -- tests/fixtures
          if ($LASTEXITCODE) { throw 'tests/fixtures differ from tools/make-fixtures.py' }

      - name: Fetch QuickLook.Common from the QuickLook release in quicklook-version.txt
        shell: pwsh
        run: ./scripts/get-quicklook-common.ps1

      - name: Remove stale build output
        shell: pwsh
        run: if (Test-Path bin) { Remove-Item bin -Recurse -Force }

      - name: Build plugin
        run: dotnet build src/QuickLook.Plugin.TrailViewer.csproj -c Release

      - name: Build test harness
        run: dotnet build tools/Harness/TrailViewer.Harness.csproj -c Release

      - name: Host boundary and file-format tests
        run: npm run test:host

      - name: Detection test on fixtures
        shell: pwsh
        run: |
          $expected = (Get-Content tests/fixtures/expected.json -Raw | ConvertFrom-Json).detect
          $names = @($expected.PSObject.Properties.Name)
          $out = bin/Harness/TrailViewer.Harness.exe detect @($names | ForEach-Object { "tests/fixtures/$_" })
          $out
          $failed = 0
          for ($i = 0; $i -lt $names.Count; $i++) {
            $want = if ($expected.($names[$i])) { 'GPX' } else { '-' }
            $got = ($out[$i] -split "`t")[0]
            if ($got -ne $want) { "FAIL $($names[$i]): expected $want, got $got"; $failed++ }
          }
          if ($failed) { throw "$failed detection result(s) wrong" }
          "All $($names.Count) fixtures detected as expected"

      - name: Browser and version tests
        shell: pwsh
        run: |
          $edge = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          if (!(Test-Path $edge)) { throw "Microsoft Edge not found at $edge" }
          $env:CHROMIUM = $edge
          npm test

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-artifacts
          path: test-results/
          if-no-files-found: ignore

      - name: Check that QuickLook.Common is not shipped
        shell: pwsh
        run: if (Test-Path bin/Release/QuickLook.Common.dll) { throw 'QuickLook.Common.dll must not be packaged' }

      - name: Pack .qlplugin
        run: node scripts/pack.cjs

      - uses: actions/upload-artifact@v7
        with:
          name: QuickLook.Plugin.TrailViewer
          path: QuickLook.Plugin.TrailViewer-*.qlplugin

      - uses: actions/upload-artifact@v7
        with:
          name: harness
          path: bin/Harness/
