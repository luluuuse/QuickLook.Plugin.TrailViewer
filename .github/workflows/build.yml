name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install browser test dependencies
        run: npm ci

      - name: Static checks
        run: npm run check

      - name: Fixtures match tools/make-fixtures.py
        shell: pwsh
        run: |
          python -B tools/make-fixtures.py
          git status --porcelain tests/fixtures
          git diff --exit-code --stat -- tests/fixtures
          if ($LASTEXITCODE) { throw 'tests/fixtures differ from tools/make-fixtures.py' }

      - name: Fetch QuickLook.Common from the QuickLook release in quicklook-version.txt
        shell: pwsh
        run: ./scripts/get-quicklook-common.ps1

      - name: Remove stale build output
        shell: pwsh
        run: if (Test-Path bin) { Remove-Item bin -Recurse -Force }

      - name: Build plugin
        run: dotnet build src/QuickLook.Plugin.TrailViewer.csproj -c Release

      - name: Build test harness
        run: dotnet build tools/Harness/TrailViewer.Harness.csproj -c Release

      - name: Host boundary and file-format tests
        run: npm run test:host

      - name: Detection test on fixtures
        shell: pwsh
        run: |
          $expected = (Get-Content tests/fixtures/expected.json -Raw | ConvertFrom-Json).detect
          $names = @($expected.PSObject.Properties.Name)
          $out = bin/Harness/TrailViewer.Harness.exe detect @($names | ForEach-Object { "tests/fixtures/$_" })
          $out
          $failed = 0
          for ($i = 0; $i -lt $names.Count; $i++) {
            $got = ($out[$i] -split "`t")[0]
            $wantedPreview = [bool]$expected.($names[$i])
            $previewable = $got -ne '-'
            if ($previewable -ne $wantedPreview) {
              "FAIL $($names[$i]): expected previewable=$wantedPreview, got $got"
              $failed++
            }
          }
          if ($failed) { throw "$failed detection result(s) wrong" }
          "All $($names.Count) fixtures detected as expected"

      - name: Unit and version tests
        run: |
          npm run test:unit
          npm run test:version

      - name: Check that QuickLook.Common is not shipped
        shell: pwsh
        run: if (Test-Path bin/Release/QuickLook.Common.dll) { throw 'QuickLook.Common.dll must not be packaged' }

      - name: Pack .qlplugin
        run: node scripts/pack.cjs

      - uses: actions/upload-artifact@v7
        with:
          name: QuickLook.Plugin.TrailViewer
          path: QuickLook.Plugin.TrailViewer-*.qlplugin

      - uses: actions/upload-artifact@v7
        with:
          name: harness
          path: bin/Harness/

  browser:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: core
            selectors: viewer route-info profile splits info-mode focus portrait ve navigation-order runner keys
          - group: map
            selectors: terrain custom-source locate zoom icons floating-panels
          - group: tools
            selectors: tools measure pins nav scrub insights
          - group: media
            selectors: export photo lang artifacts
          - group: network
            selectors: network
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Browser tests (${{ matrix.group }})
        shell: pwsh
        run: |
          $edge = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          if (!(Test-Path $edge)) { throw "Microsoft Edge not found at $edge" }
          $env:CHROMIUM = $edge
          node scripts/test.cjs ${{ matrix.selectors }}

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-${{ matrix.group }}
          path: test-results/
          if-no-files-found: ignore

  sync-gitcode:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Push main branch to GitCode mirror
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          if [ -z "$GITCODE_TOKEN" ]; then
            echo "GITCODE_TOKEN not set; skipping GitCode main sync."
            exit 0
          fi
          encoded=$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["GITCODE_TOKEN"], safe=""))')
          git push "https://oauth2:${encoded}@gitcode.com/luluse/QuickLook.Plugin.TrailViewer.git" HEAD:refs/heads/main
